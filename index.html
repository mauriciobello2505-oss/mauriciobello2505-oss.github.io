<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1c120c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Ruta Blindada</title>
<style>
:root{--sand:#f6dfb4;--brass:#f2b632;--rust:#d9531e;--ink:#2a1d14;--panel:rgba(32,22,16,.93);--text:#fbe9c6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(18,12,9,.95);--text:#f6dfb4}}
:root[data-theme="dark"]{--panel:rgba(18,12,9,.95);--text:#f6dfb4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1c120c;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fn{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.bar{width:min(34vw,180px);height:14px;border:2px solid var(--brass);background:#0007;border-radius:3px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(#ee7a46,#b8381a);transition:width .15s}
.pill{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:17px;color:var(--brass);text-shadow:0 2px 0 #000a;text-align:center}
.pill small{display:block;font-size:12px;color:var(--sand)}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--brass);border:2px solid #b27c12;vertical-align:-1px;margin-right:5px}
#bn{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:clamp(34px,9vw,72px);color:var(--sand);text-shadow:0 4px 0 var(--rust);opacity:0;pointer-events:none}
#bn.on{animation:bn 1.9s ease both}
@keyframes bn{0%{opacity:0;transform:scale(2.2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14vh;text-align:center;cursor:pointer;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
#tt{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:clamp(40px,11vw,100px);line-height:1;color:var(--sand);text-shadow:0 5px 0 var(--rust),0 10px 24px #000a;padding:0 10px}
#tt span{display:inline-block;animation:slam .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(2.1s + var(--i)*70ms)}
@keyframes slam{from{opacity:0;transform:translateY(-70px) scale(1.7)}to{opacity:1;transform:none}}
#sub{margin-top:14px;font-size:clamp(15px,3.6vw,22px);font-weight:700;color:var(--sand);text-shadow:0 2px 6px #000;animation:fi .6s 3.2s both}
#tap{margin-top:26px;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:clamp(18px,4.5vw,26px);color:var(--brass);text-shadow:0 2px 0 #000;animation:fi .5s 3.9s both,bl 1.3s 4.4s infinite}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:.25}}
#shop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#shop.on{display:flex;animation:fi .35s both}
.pn{width:min(94vw,540px);max-height:94%;overflow:auto;touch-action:pan-y;background:var(--panel);border:2px solid var(--brass);border-radius:6px;padding:16px}
.pn h2{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:26px;color:var(--sand)}
.pn p{margin:4px 0 12px;color:var(--brass);font-weight:700;font-size:18px}
#ups{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:520px){#ups{grid-template-columns:1fr 1fr}}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;color:var(--text);background:#ffffff12;border:1.5px solid #f2b63266;border-radius:5px;padding:10px 12px;cursor:pointer}
.up small{display:block;font-weight:500;opacity:.8;font-size:13px;margin-top:2px}
.up i{font-style:normal;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;color:var(--brass);font-size:18px;white-space:nowrap}
.up:active:not(:disabled){transform:scale(.97);background:#f2b63233}
.up:disabled{opacity:.4;cursor:default}
#go{margin-top:14px;width:100%;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:21px;padding:13px;border:0;border-radius:5px;background:var(--brass);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #8a5e10}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5e10}
.sl{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1.5px solid #f2b63244;border-radius:5px;padding:8px}.sl>b{min-width:78px;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;color:var(--sand)}.sl>div{display:flex;gap:6px;flex-wrap:wrap}
.wb{font:inherit;font-weight:700;font-size:13px;color:var(--text);background:#ffffff12;border:1.5px solid #f2b63255;border-radius:4px;padding:6px 8px;cursor:pointer;text-align:center}.wb small{display:block;font-weight:500;font-size:11px;opacity:.85}.wb.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}.wb:disabled{opacity:.4}
#joy{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:132px;height:132px;border-radius:50%;border:2px solid #f2b63299;background:radial-gradient(#00000055,#00000022);display:none;align-items:center;justify-content:center;touch-action:none;opacity:.85}#joy.on{display:flex}
#kn{width:56px;height:56px;border-radius:50%;background:radial-gradient(#ffd56a,#c8891a);border:2px solid #7a520c;box-shadow:0 3px 8px #000a;pointer-events:none}
#rot{position:fixed;inset:0;z-index:50;background:#140d09;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:22px;color:var(--sand);padding:20px}
#rot i{width:46px;height:78px;border:4px solid var(--brass);border-radius:9px;animation:rt 2.2s ease-in-out infinite}
@keyframes rt{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){#rot{display:flex}}
#mb{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;padding:12px 18px;border-radius:6px;border:2px solid var(--brass);background:rgba(20,13,9,.88);color:var(--brass);font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;font-size:16px;cursor:pointer}
#mb.on{display:block}#mb.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px #f2b63244}}
#cx{float:right;font-size:26px;line-height:1;background:none;border:0;color:var(--brass);cursor:pointer;padding:0 4px}
#shop:not(.dr) #cx{display:none}
#shop.dr{background:none;pointer-events:none;align-items:flex-end;justify-content:flex-start;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 80px);padding-left:calc(env(safe-area-inset-left,0px) + 12px)}
#shop.dr .pn{pointer-events:auto;width:min(82vw,360px);max-height:calc(100% - 12px);background:rgba(18,12,9,.9)}
#shop.dr #ups{grid-template-columns:1fr}#shop.dr #go{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div class="bar"><div id="hp"></div></div></div><div class="pill" id="wv"></div><div class="pill"><span class="coin"></span><span id="co">0</span></div></div>
<div id="joy"><div id="kn"></div></div>
<div id="rot"><i></i>Gira el teléfono a horizontal para jugar</div>
<button id="mb">Mejoras</button>
<div id="bn"></div>
<div id="intro"><div id="tt"></div><div id="sub">Un convoy. Un solo cañón.</div><div id="tap">Toca para arrancar</div></div>
<div id="shop"><div class="pn"><button id="cx" aria-label="Cerrar">×</button><h2 id="st"></h2><p><span class="coin"></span><span id="cn">0</span></p><div id="ups"></div><button id="go"></button></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),R=Math.random,PI=Math.PI,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=800,H=450,S=1,GY=372;
var Q=1;function rs(){const d=Math.min(devicePixelRatio||1,Q?3:2);cv.width=innerWidth*d;cv.height=innerHeight*d;S=Math.min(cv.height/450,cv.width/460);W=cv.width/S;H=cv.height/S;GY=H>600?Math.round(H*.8):H-78;L=null}
addEventListener('resize',rs);rs();
let P={coins:0,lv:{dmg:0,rate:0,arm:0,hp:0,loot:0},best:1,floors:0,slots:['mg'],own:{mg:1}};
try{const s=JSON.parse(localStorage.getItem('rb1'));if(s&&s.lv)P=Object.assign(P,s)}catch(e){}
const sv=()=>{try{localStorage.setItem('rb1',JSON.stringify(P))}catch(e){}};
const UP=[
{k:'dmg',n:'Calibre',c:30,d:l=>'Daño x'+(1+.25*l).toFixed(2)},
{k:'rate',n:'Cadencia',c:40,d:l=>'Cadencia x'+(1+.2*l).toFixed(1)},
{k:'arm',n:'Blindaje',c:50,d:l=>'-'+Math.round(Math.min(60,8*l))+'% daño'},
{k:'hp',n:'Chasis',c:35,d:l=>'Vida '+(100+30*l)},
{k:'loot',n:'Botín',c:60,d:l=>'Monedas +'+Math.round(20*l)+'%'}];
const cost=u=>Math.round(u.c*Math.pow(1.5,P.lv[u.k]));
const WP={
mg:{n:'Ametralladora',c:0,d:12,rt:3,sp:950,pel:1,spread:.05,len:40,th:6,col:'#1c1c1c',bc:'#ffe08a',sf:[220,60,.08,'square',.04]},
shot:{n:'Escopeta',c:90,d:8,rt:1.2,sp:800,pel:6,spread:.26,life:.3,len:30,th:8,col:'#3a2a1c',bc:'#ffcf7a',sf:[140,40,.14,'sawtooth',.07]},
rocket:{n:'Cohetes',c:180,d:45,rt:.8,sp:520,pel:1,spread:.02,aoe:80,len:38,th:11,col:'#46512a',bc:'#ff8a3a',sf:[120,30,.25,'sawtooth',.08]},
snip:{n:'Francotirador',c:150,d:70,rt:.9,sp:1500,pel:1,spread:0,pierce:1,len:54,th:4,col:'#222',bc:'#fff',sf:[400,50,.16,'square',.07]}};
const FC=[120,260,520];
function pv(i){return i?[car.x-14,GY-38-40*i+16]:[car.x+8,GY-52]}
function shootSlot(i){const wk=P.slots[i],w=WP[wk],p=pv(i),x=p[0],y=p[1],a=aimA[i],dm=1+.25*P.lv.dmg;
cdA[i]=1/(w.rt*(1+.2*P.lv.rate));recA[i]=1;shake=Math.max(shake,wk=='rocket'?3:1.6);sfx(...w.sf);
const mx=x+Math.cos(a)*w.len,my=y+Math.sin(a)*w.len;
for(let j=0;j<w.pel;j++){const q=a+(R()-.5)*w.spread;bl.push({x:mx,y:my,vx:Math.cos(q)*w.sp,vy:Math.sin(q)*w.sp,d:w.d*dm,life:w.life||2,aoe:w.aoe,hit:w.pierce?[]:0,col:w.bc})}
if(wk=='mg'||wk=='snip')pt(x,y,-90-R()*40,-130,.5,1.8,'#f2b632',600,0);
for(let j=0;j<3;j++)pt(mx,my,Math.cos(a)*(100+R()*160)+(R()-.5)*60,Math.sin(a)*(100+R()*160)+(R()-.5)*60,.12,2.5,'#ffe08a',0,1)}
function blast(b){boom(b.x,Math.min(b.y,GY-8),1.1);for(const e of en)if(!e.dead&&Math.abs(e.x-b.x)<b.aoe+TY[e.k].w/2*e.s){e.hp-=b.d;e.h=1;if(e.hp<=0)kill(e)}}
const stat={dmg:()=>12*(1+.25*P.lv.dmg),rate:()=>3+.6*P.lv.rate,arm:()=>1-Math.min(.6,.08*P.lv.arm),hp:()=>100+30*P.lv.hp,loot:()=>1+.2*P.lv.loot};
const TY={sol:{hp:50,sp:55,w:16,h:38,fr:1.6,stop:300,coin:4,dmg:7},jeep:{hp:100,sp:150,w:54,h:30,fr:0,stop:0,coin:10,dmg:30},tank:{hp:360,sp:32,w:80,h:46,fr:2.6,stop:430,coin:30,dmg:24},heli:{hp:170,sp:75,w:64,h:24,fr:1.7,stop:280,coin:25,dmg:10}};
let st='intro',t=0,scr=0,spd=0,shake=0,fl=0,wave=1,left=0,spT=0,done=0,aim=-.2,rec=0,cd=0,fire=0,px=600,py=200,boss=0,deadT=0,lastD=0,lastC=0;
const aimA=[-.2,-.2,-.2,-.2],recA=[0,0,0,0],cdA=[0,0,0,0];let nw=0;
const car={x:-200,hp:100,mh:100,hit:0,gone:0};
car.mh=car.hp=stat.hp();
let bl=[],eb=[],en=[],pa=[],co=[],ft=[];
let AC;
function sfx(f0,f1,d,ty,v){if(!AC)return;try{const o=AC.createOscillator(),gn=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),n+d);gn.gain.setValueAtTime(v,n);gn.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function pt(x,y,vx,vy,l,r,c,gv,add){const p={x,y,vx,vy,l,m:l,r,c,gv,add};pa.push(p);return p}
function boom(x,y,s){for(let i=0;i<14*s;i++){const a=R()*PI*2,v=40+R()*200*s;pt(x,y,Math.cos(a)*v,Math.sin(a)*v-60,.35+R()*.45,3+R()*6*s,R()<.5?'#ffb43a':'#ff5a1f',200,1)}
for(let i=0;i<7*s;i++)pt(x+(R()-.5)*20,y,(R()-.5)*60,-30-R()*60,.8+R()*.8,8+R()*10*s,'#2b2420',-30,0);
const r=pt(x,y,0,0,.35,6,'#ffd68a',0,1);r.ring=1;r.gr=260*s;shake=Math.max(shake,4*s+2);sfx(110,25,.45,'sawtooth',.12)}
function hurt(d){if(car.gone)return;car.hp-=d*stat.arm();car.hit=1;fl=.25;shake=Math.max(shake,6);ft.push({x:car.x+10+R()*30,y:GY-70-R()*20,s:'-'+Math.round(d*stat.arm()),l:.8,c:'#ff6a4a'});sfx(150,60,.1,'square',.06);for(let i=0;i<6;i++)pt(car.x+R()*40,GY-30-R()*20,(R()-.3)*160,-R()*160,.3,2,'#ffd68a',500,1);
if(car.hp<=0){car.hp=0;st='dead';deadT=0;car.gone=1;fire=0;boom(car.x,GY-30,3);sv()}}
function spawn(isBoss){let k='sol',r=R();if(wave>=4&&r<.16)k='heli';else if(wave>=3&&r<.32)k='tank';else if(wave>=2&&r<.55)k='jeep';
const m=Math.pow(1.14,wave-1),e={k,x:W+60,hp:TY[k].hp*m,mh:TY[k].hp*m,s:k=='sol'?1.5:k=='jeep'?1.4:k=='heli'?1.3:1.25,fy:k=='heli'?95+R()*40:0,f:R()*2,h:0,ph:R()*6,off:R()*70,v:TY[k].coin*(1+.15*(wave-1))};{const q=R();e.role=k=='sol'?(q<.3?'cl':q<.75?'rf':'sn'):'';e.sd=k=='sol'?(e.role=='cl'?110+R()*50:e.role=='rf'?250+R()*90:9999):TY[k].stop+e.off;if(e.role=='cl')e.sp=TY.sol.sp*1.35}
if(isBoss){e.k='tank';e.boss=1;e.role='';e.sd=TY.tank.stop;e.s=1.9;e.fy=0;e.hp=e.mh=TY.tank.hp*m*8;e.v=TY.tank.coin*6*(1+.15*(wave-1));e.off=0}en.push(e)}
function kill(e){if(e.k=='sol')cp.push({x:e.x,y:GY-14,vx:60+R()*90,vy:-170-R()*90,r:0,vr:3+R()*3,l:3.2,s:e.s,off:e.off,ph:e.ph,mv:0});const v=Math.round(e.v*stat.loot()),n=Math.min(7,1+(v/4|0));boom(e.x,GY-18,e.k=='tank'?e.s*1.4:.8);
for(let i=0;i<n;i++)co.push({x:e.x,y:GY-20,vx:(R()-.5)*180-60,vy:-200-R()*120,v:Math.max(1,Math.round(v/n)),age:0});e.dead=1}
function efire(e){e.fk=.14;const T=TY[e.k],sx=e.x-T.w/2*e.s,sy=GY-(e.fy||(e.k=='sol'?22*e.s:36*e.s)),tx=car.x,ty=GY-28-R()*40*P.floors,d=Math.hypot(tx-sx,ty-sy),v=e.role=='sn'?700:e.k=='sol'?380:e.k=='heli'?320:280;
eb.push({x:sx,y:sy,vx:(tx-sx)/d*v,vy:(ty-sy)/d*v+(R()-.5)*(e.role=='sn'?0:40),d:T.dmg*Math.pow(1.08,wave-1)*(e.boss?1.4:1)*(e.role=='sn'?2.4:1),sh:e.k=='tank'});
pt(sx,sy,-40,0,.12,5,'#ffe08a',0,1);if(e.k=='tank'){shake=Math.max(shake,3);sfx(90,40,.2,'sawtooth',.1)}else sfx(300,120,.05,'square',.02)}
function startWave(n){wave=n;boss=Math.floor(n/4);left=5+n*3+boss;spT=1.3;done=0;st='play';bl=[];eb=[];en=[];banner((boss?'⚠ '+boss+(boss>1?' JEFES':' JEFE')+' · ':'')+'OLEADA '+n)}
function banner(s){const b=$('bn');b.className='';b.textContent=s;void b.offsetWidth;b.className='on'}
function endWave(){const b=20+wave*5;P.coins+=b;P.best=Math.max(P.best,wave);sv();ft.push({x:car.x,y:GY-90,s:'+'+b+' bonus',l:1.8});banner('OLEADA '+wave+' SUPERADA');nw=3.5}
function showShop(title,dead){$('st').textContent=title;$('go').textContent=dead?'Reintentar oleada '+wave:'Oleada '+(wave+1);$('go').dataset.dead=dead;renderShop();$('shop').classList.remove('dr');$('shop').dataset.d=dead?'1':'';$('shop').classList.add('on')}
var lastS=0;function syncShop(){$('cn').textContent=Math.floor(P.coins);document.querySelectorAll('#ups [data-c]').forEach(b=>{const i=b.dataset.i;b.disabled=b.dataset.x=='1'||P.coins<+b.dataset.c||(i=='r'&&car.hp>=car.mh);if(i=='r')b.querySelector('small').textContent='Vida '+Math.ceil(car.hp)+' / '+car.mh})}
function renderShop(){$('cn').textContent=Math.floor(P.coins);let h='';const nf=P.floors;
if(nf<3){const fc=FC[nf];h+=`<button class="up" style="grid-column:1/-1" data-i="f" data-c="${fc}"><span><b>Añadir piso ${nf+1}</b><small>Un puesto de arma más arriba</small></span><i>${fc}</i></button>`}
for(let i=0;i<=nf;i++){h+=`<div class="sl"><b>${i?'Piso '+i:'Cubierta'}</b><div>`;for(const k in WP){const w=WP[k],on=P.slots[i]==k,ow=P.own[k];h+=`<button class="wb${on?' on':''}" data-w="${i}:${k}" data-c="${ow?0:w.c}"><span>${w.n}</span><small>${on?'equipada':ow?'equipar':w.c}</small></button>`}h+='</div></div>'}
UP.forEach((u,i)=>{const l=P.lv[u.k],mx=u.k=='arm'&&l>=8,c=cost(u);h+=`<button class="up" data-i="${i}" data-c="${c}" data-x="${mx?1:0}"><span><b>${u.n}</b> · nivel ${l}<small>${u.d(l)} ▸ ${u.d(l+1)}</small></span><i>${mx?'MAX':c}</i></button>`});
h+=`<button class="up" data-i="r" data-c="15"><span><b>Reparar</b><small>Vida ${Math.ceil(car.hp)} / ${car.mh}</small></span><i>15</i></button>`;$('ups').innerHTML=h;syncShop()}
